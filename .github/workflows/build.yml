name: Build Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    name: Docker Container Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      dockerfile-path: 'Dockerfile.targeting'
      image-name: 'targeting-service'
      push-image: false
