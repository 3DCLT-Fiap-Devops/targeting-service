name: Build Pipeline

on:
  push:
    branches: [main, master, dev]


concurrency:
  group: build-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality Checks
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      python-version: "3.11"

  build:
    needs: quality
    name: Docker Container Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      dockerfile-path: "Dockerfile.targeting"
      image-name: "targeting-service"
      push-image: false
