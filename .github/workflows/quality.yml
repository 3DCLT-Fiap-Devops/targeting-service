name: Quality Pipeline

on:
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: quality-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Unit Tests
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      python-version: '3.11'
